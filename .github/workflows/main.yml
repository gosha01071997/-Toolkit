name: Build APK and EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── JOB 1: Android APK ──────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Build Tools
        run: |
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Install Capacitor 5
        run: |
          npm install \
            @capacitor/core@5.7.8 \
            @capacitor/cli@5.7.8 \
            @capacitor/android@5.7.8

      - name: Init Capacitor
        run: npx cap init "EMC Toolkit" "ru.emc.toolkit" --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMC-Toolkit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ── JOB 2: Windows EXE ──────────────────────────
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_DISABLE_LICENSE_GATING: 'true'

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify NSIS installer
        shell: pwsh
        run: |
          if (-not (Test-Path "release/EMC-Toolkit-Setup.exe")) { throw "NSIS installer was not produced" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EMC-Toolkit-Windows
          path: release/EMC-Toolkit-Setup.exe
          retention-days: 30

  # ── JOB 3: iOS Simulator app ────────────────────
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: EMC-Toolkit-iOS
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
