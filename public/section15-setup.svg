<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
 <title id="title">Схема установки для испытания на магнитное воздействие</title><desc id="desc">Компас слева, испытуемое оборудование справа, между ними расстояние D.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#60a5fa"/></marker><marker id="both" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0L0 4L8 8z" fill="#fbbf24"/></marker></defs>
 <rect width="1000" height="520" rx="22" fill="#0b1220"/><path d="M90 420H910" stroke="#64748b" stroke-width="12"/><text x="500" y="458" text-anchor="middle" fill="#94a3b8" font-family="sans-serif">Немагнитная поверхность / опоры</text>
 <path d="M110 130V45" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)"/><text x="110" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22">Север</text><path d="M45 155H180" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/><text x="112" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18">Запад — Восток</text>
 <circle cx="280" cy="290" r="90" fill="#172554" stroke="#60a5fa" stroke-width="5"/><circle cx="280" cy="290" r="8" fill="#fbbf24"/><path d="M280 215L300 305L280 290L260 305z" fill="#f87171"/><text x="280" y="400" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20">Компас / магнитный датчик</text><text x="280" y="320" text-anchor="middle" fill="#fbbf24" font-family="sans-serif">ось</text>
 <rect x="650" y="220" width="230" height="150" rx="12" fill="#163349" stroke="#34d399" stroke-width="5"/><text x="765" y="285" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">Испытуемое</text><text x="765" y="315" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">оборудование</text><path d="M880 310C940 310 920 390 970 390" fill="none" stroke="#a78bfa" stroke-width="8"/><text x="900" y="285" fill="#c4b5fd" font-family="sans-serif">Жгут</text>
 <path d="M290 175V130M650 220V130M300 145H640" stroke="#fbbf24" stroke-width="4" marker-start="url(#both)" marker-end="url(#both)"/><text x="470" y="120" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="28">D</text><text x="470" y="175" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="16">от оси до ближайшей части ИО</text>
</svg>
